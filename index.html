<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ciaodaale</title>
<meta name="description" content="Piccoli progetti, strumenti e pagine interattive.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: una colonna stretta, nome grande in alto, elenco progetti come righe cliccabili */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --fg:#111A2B; --muted:#5B6578; --line:#DDE2EB; --accent:#2346C8;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0D121C; --surface:#151C2A; --fg:#E7ECF5; --muted:#98A2B5; --line:#273145; --accent:#7E98FF; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:56px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(3rem,12vw,5rem);line-height:.9;margin:0;letter-spacing:.01em}
.lede{color:var(--muted);margin:12px 0 0;max-width:52ch}
h2{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 10px}
.projects{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.projects a{display:grid;grid-template-columns:1fr auto;gap:2px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
.projects a:hover{border-color:var(--accent);transform:translateY(-1px)}
.projects a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.projects strong{font-family:var(--display);font-size:1.6rem;font-weight:700;line-height:1.1}
.projects p{margin:0;color:var(--muted);font-size:.92rem;grid-column:1}
.projects .go{grid-row:1 / span 2;grid-column:2;color:var(--accent);font-size:1.4rem}
.date{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
footer{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion: reduce){.projects a{transition:none}.projects a:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ciaodaale</h1>
    <p class="lede">Piccoli progetti, strumenti e pagine interattive.</p>
  </header>

  <section>
    <h2>Progetti</h2>
    <ul class="projects">
      <!-- Per aggiungere un progetto: copia il blocco <li> qui sotto e cambia link, titolo e descrizione -->
      <li>
        <a href="yz-inter/">
          <strong>YZ Volley o Inter?</strong>
          <p>Le partite della YZ Volley confrontate con quelle dell'Inter, con le sovrapposizioni in evidenza.</p>
          <span class="date">Ottobre 2026</span>
          <span class="go" aria-hidden="true">→</span>
        </a>
      </li>
    </ul>
  </section>

  <footer>ciaodaale.github.io</footer>
</div>
</body>
</html>
